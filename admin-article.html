<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <style>
        :root {
            --bg-color: #fdfdfd;
            --card-bg: #ffffff;
            --text-color: #2c2c2c;
            --text-muted: #888888;
            --border-color: #e5e5e5;
            --primary-color: #1a1a1a;
        }
        body {
            font-family: "Noto Serif SC", serif;
            background: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .admin-container {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 600px;
        }
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            text-align: center;
            margin-bottom: 30px;
            font-style: italic;
        }
        .form-group { margin-bottom: 25px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: var(--text-muted); font-size: 0.9rem; }
        input[type="text"], input[type="password"], select, textarea {
            width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 4px;
            font-family: inherit; font-size: 1rem; background: transparent; box-sizing: border-box; transition: 0.3s;
        }
        input:focus, textarea:focus, select:focus { outline: none; border-color: var(--primary-color); }
        textarea { resize: vertical; min-height: 200px; line-height: 1.8; }
        button {
            width: 100%; padding: 15px; background: var(--primary-color); color: white; border: none;
            border-radius: 4px; font-size: 1.1rem; font-family: inherit; cursor: pointer; transition: 0.3s;
        }
        button:hover { background: #333; }
        #status { margin-top: 20px; text-align: center; font-size: 0.9rem; white-space: pre-wrap; line-height: 1.6; }
        .help-text { font-size: 0.8rem; color: var(--text-muted); margin-top: 5px; }
    </style>
</head>
<body>

<div class="admin-container">
    <h1>Publish Article</h1>
    
    <div class="form-group">
        <label>授权密钥 (Token)</label>
        <input type="password" id="token" placeholder="输入你的 GitHub Token" autocomplete="off">
    </div>

    <div style="display: flex; gap: 15px;">
        <div class="form-group" style="flex: 1;">
            <label>所属分类</label>
            <select id="category">
                <option value="今日杂谈">今日杂谈</option>
                <option value="魔鬼契约">魔鬼契约</option>
                <option value="游记">游记</option>
                <option value="寓言">寓言</option>
                <option value="糖果屋">糖果屋</option>
            </select>
        </div>
        <div class="form-group" style="flex: 1;">
            <label>网页文件名 (英文)</label>
            <input type="text" id="filename" placeholder="例如: chat6">
            <div class="help-text">只写英文，自动加 .html</div>
        </div>
    </div>

    <div class="form-group">
        <label>文章大标题</label>
        <input type="text" id="title" placeholder="例如：六. 关于死亡">
    </div>

    <div class="form-group">
        <label>文章正文 (直接回车换行即可)</label>
        <textarea id="content" placeholder="在这里写下你的文字..."></textarea>
    </div>

    <button id="publish-btn">刻下契约 (发布文章)</button>
    <div id="status"></div>
</div>

    function utf8_to_b64(str) { return btoa(unescape(encodeURIComponent(str))); }
    function b64_to_utf8(str) { return decodeURIComponent(escape(atob(str))); }

    document.addEventListener('DOMContentLoaded', () => {
        const savedToken = localStorage.getItem('empathy_github_token');
        if (savedToken) document.getElementById('token').value = savedToken;
    });

        const token = document.getElementById('token').value.trim();
        const category = document.getElementById('category').value;
        const filenameRaw = document.getElementById('filename').value.trim().toLowerCase();
        const title = document.getElementById('title').value.trim();
        const rawContent = document.getElementById('content').value.trim();
        const statusEl = document.getElementById('status');

        if (!token || !filenameRaw || !title || !rawContent) {
            statusEl.innerText = "请填写所有必填字段！";
            statusEl.style.color = "red";
            return;
