<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empathy - 后台发布</title>
    <meta name="robots" content="noindex, nofollow">
    <style>
        :root {
            --bg-color: #fdfdfd;
            --card-bg: #ffffff;
            --text-color: #2c2c2c;
            --text-muted: #888888;
            --border-color: #e5e5e5;
            --primary-color: #1a1a1a;
        }
        body {
            font-family: "Noto Serif SC", serif;
            background: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .admin-container {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 500px;
        }
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            text-align: center;
            margin-bottom: 30px;
            font-style: italic;
        }
        .form-group {
            margin-bottom: 25px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        input[type="text"], input[type="password"], textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-family: inherit;
            font-size: 1rem;
            background: transparent;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-color);
        }
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        button {
            width: 100%;
            padding: 15px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1.1rem;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
        }
        button:hover {
            background: #333;
        }
        button:active {
            transform: scale(0.98);
        }
        #status {
            margin-top: 20px;
            text-align: center;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="admin-container">
    <h1>Empathy CMS</h1>
    
    <div class="form-group">
        <label>授权密钥 (Token)</label>
        <input type="password" id="token" placeholder="输入你的 GitHub Token" autocomplete="off">
    </div>

    <div class="form-group">
        <label>书名</label>
        <input type="text" id="book-title" placeholder="例如：《挪威的森林》">
    </div>

    <div class="form-group">
        <label>我心情</label>
        <textarea id="book-mood" placeholder="极度私密的情绪..."></textarea>
    </div>

    <div class="form-group">
        <label>我说白了</label>
        <textarea id="book-summary" placeholder="理智的情节拆解..."></textarea>
    </div>

    <button id="publish-btn">刻下契约 (发布)</button>
    <div id="status"></div>
</div>

<script>
    // 页面加载时读取存过的 token
    document.addEventListener('DOMContentLoaded', () => {
        const savedToken = localStorage.getItem('empathy_github_token');
        if (savedToken) document.getElementById('token').value = savedToken;
    });

    document.getElementById('publish-btn').addEventListener('click', async () => {
        const token = document.getElementById('token').value.trim();
        const title = document.getElementById('book-title').value.trim();
        const mood = document.getElementById('book-mood').value.trim();
        const summary = document.getElementById('book-summary').value.trim();
        const statusEl = document.getElementById('status');

        if (!token || !title || !mood || !summary) {
            statusEl.innerText = "请填写所有字段";
            statusEl.style.color = "red";
            return;
        }

        // 保存 token 到本地，以后不用每次都填
        localStorage.setItem('empathy_github_token', token);

        statusEl.innerText = "正在通过虚空连接 GitHub 服务器...";
        statusEl.style.color = "var(--text-muted)";

        const repo = "ThreeB0tt1e/my-website-gohellwithme";
        const path = "books.html";
        const apiUrl = \https://api.github.com/repos/\/contents/\\;

        try {
            // 1. 获取现在的 books.html
            const getRes = await fetch(apiUrl, {
                headers: { 'Authorization': \	oken \\ }
            });
            
            if (!getRes.ok) throw new Error("获取文件失败，请检查 Token 是否有效且拥有 repo 权限");
            
            const fileData = await getRes.json();
            // GitHub 的内容是 base64 编码的，需要解码
            const currentContent = decodeURIComponent(escape(atob(fileData.content)));
            const sha = fileData.sha;

            // 2. 生成新卡片的 HTML
            const newCard = \
            <!-- 单本书籍模块 -->
            <div class="book-review-card" style="background: var(--card-bg); border: 1px solid var(--border-color); padding: 35px; border-radius: 4px; box-shadow: 0 5px 20px rgba(0,0,0,0.02); position: relative;">
                <h3 class="book-title" style="font-family: 'Playfair Display', 'Noto Serif SC', serif; font-size: 1.5rem; color: var(--text-color); margin: 0 0 25px 0; padding-bottom: 15px; border-bottom: 1px dashed var(--border-color);">
                    \
                </h3>
                <div class="book-meta" style="display: flex; flex-direction: column; gap: 20px;">
                    <div class="meta-row" style="display: flex; align-items: flex-start; line-height: 1.8;">
                        <span class="meta-label" style="font-family: 'Noto Serif SC', serif; font-weight: bold; color: var(--text-muted); min-width: 90px; font-size: 0.95rem; margin-right: 15px;">我心情：</span>
                        <span class="meta-content" style="color: var(--text-color); flex: 1; font-style: italic;">
                            \
                        </span>
                    </div>
                    <div class="meta-row" style="display: flex; align-items: flex-start; line-height: 1.8;">
                        <span class="meta-label" style="font-family: 'Noto Serif SC', serif; font-weight: bold; color: var(--text-muted); min-width: 90px; font-size: 0.95rem; margin-right: 15px;">我说白了：</span>
                        <span class="meta-content" style="color: var(--text-color); flex: 1; text-align: justify;">
                            \
                        </span>
                    </div>
                </div>
            </div>\;

            // 3. 寻找插入点 (在 <!-- 书单模块列表 --> 所在的 div 后面)
            const insertPoint = '<div class="book-review-list js-enabled" style="display: flex; flex-direction: column; gap: 40px; margin-bottom: 60px;">';
            if (!currentContent.includes(insertPoint)) throw new Error("找不到插入点，可能 books.html 结构被破坏");
            
            const newContent = currentContent.replace(insertPoint, insertPoint + "\\n" + newCard);

            // 4. 将新内容重新转码为 base64
            const encodedContent = btoa(unescape(encodeURIComponent(newContent)));

            // 5. 提交回 GitHub
            statusEl.innerText = "正在刻下契约并同步全网...";
            const putRes = await fetch(apiUrl, {
                method: 'PUT',
                headers: {
                    'Authorization': \	oken \\,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    message: \eat: add new book review (\) via CMS\,
                    content: encodedContent,
                    sha: sha
                })
            });

            if (!putRes.ok) throw new Error("上传失败，可能是网络问题");

            statusEl.innerText = "✨ 契约已生效！新书单已发布到外网。你可以去刷新页面了。";
            statusEl.style.color = "green";
            
            // 清空表单
            document.getElementById('book-title').value = '';
            document.getElementById('book-mood').value = '';
            document.getElementById('book-summary').value = '';

        } catch (error) {
            statusEl.innerText = "出错了：" + error.message;
            statusEl.style.color = "red";
        }
    });
</script>
</body>
</html>
