    <style>
        /* Editorial Archive List Styles */
        .archive-list {
            margin-top: 80px;
            margin-bottom: 100px;
            display: flex;
            flex-direction: column;
        }
        .archive-item {
            display: block;
            text-decoration: none;
            color: var(--text-color);
            border-bottom: 1px solid var(--border-color);
            padding: 40px 0;
            position: relative;
            transition: padding-left 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s;
            opacity: 0; /* initial for GSAP */
        }
        .archive-item:first-child {
            border-top: 1px solid var(--border-color);
        }
        .archive-item:hover {
            padding-left: 30px;
        }
        .archive-title {
            font-family: 'Playfair Display', 'Noto Serif SC', serif;
            font-size: 2.5rem;
            font-weight: 500;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .archive-meta {
            font-size: 0.9rem;
            font-family: 'Playfair Display', serif;
            color: var(--text-muted);
            font-style: italic;
        }
        
        /* Canvas Veil Styles */
        #fog-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9998;
            background: transparent;
            pointer-events: auto;
            touch-action: none;
        }
        #fog-canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #fog-hint {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 9999;
            pointer-events: none;
            text-align: center;
            color: #fff; /* White text on dark fog */
            font-family: 'Playfair Display', serif;
            mix-blend-mode: difference;
        }
        #fog-hint h2 {
            font-size: 4rem;
            letter-spacing: 0.2em;
            margin: 0 0 10px 0;
            font-weight: normal;
        }
        #fog-hint p {
            font-family: 'Noto Serif SC', serif;
            font-size: 0.9rem;
            opacity: 0.6;
            letter-spacing: 0.1em;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.8; }
        }
        @media (max-width: 768px) {
            .archive-title { font-size: 1.8rem; }
            #fog-hint h2 { font-size: 2.5rem; }
            .archive-item:hover { padding-left: 10px; }
        }
    </style>
</head>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://unpkg.com/split-type"></script>
    <script src="main.js?v=202610081830"></script>
    <script>
        // === The Canvas Veil Logic ===
        document.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('fog-canvas');
            const overlay = document.getElementById('fog-overlay');
            const hint = document.getElementById('fog-hint');
            const archiveContainer = document.querySelector('.archive-container');
            const archiveItems = document.querySelectorAll('.archive-item');
            
            // UX: Only require wiping once per session
            if (sessionStorage.getItem('empathy_veil_cleared') === 'true') {
                if (overlay) overlay.remove();
                if (hint) hint.remove();
                archiveContainer.style.display = 'block';
                gsap.fromTo(archiveItems, 
                    { opacity: 0, y: 15 },
                    { opacity: 1, y: 0, duration: 0.6, stagger: 0.05, ease: 'power2.out' }
                );
                return;
            }
            
            if (!canvas) return;
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            
            let width = window.innerWidth;
            let height = window.innerHeight;
            
            function resize() {
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width;
                canvas.height = height;
                fillFog();
            }
            
            function fillFog() {
                ctx.globalCompositeOperation = 'source-over';
                ctx.fillStyle = '#111827'; // Dark charcoal fog
                ctx.fillRect(0, 0, width, height);
            }
            
            window.addEventListener('resize', resize);
            resize();
            
            archiveContainer.style.display = 'block';
            
            let isDrawing = false;
            let totalErasedPixels = 0;
            let veilRemoved = false;
            let lastPos = null;
            
            function getPos(e) {
                if (e.touches && e.touches.length > 0) {
                    return { x: e.touches[0].clientX, y: e.touches[0].clientY };
                }
                return { x: e.clientX, y: e.clientY };
            }
            
            function erase(x, y) {
                if (veilRemoved) return;
                
                if (lastPos) {
                    const dx = x - lastPos.x;
                    const dy = y - lastPos.y;
                    totalErasedPixels += Math.sqrt(dx*dx + dy*dy);
                }
                lastPos = {x, y};
                
                ctx.globalCompositeOperation = 'destination-out';
                const radius = window.innerWidth < 768 ? 60 : 100;
                const gradient = ctx.createRadialGradient(x, y, 0, x, y, radius);
                gradient.addColorStop(0, 'rgba(0,0,0,1)');
                gradient.addColorStop(0.5, 'rgba(0,0,0,0.8)');
                gradient.addColorStop(1, 'rgba(0,0,0,0)');
                
                ctx.beginPath();
                ctx.fillStyle = gradient;
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.fill();
                
                const threshold = window.innerWidth < 768 ? 2000 : 4000;
                if (totalErasedPixels > threshold && !veilRemoved) {
                    removeVeil();
                }
            }
            
            function removeVeil() {
                veilRemoved = true;
                overlay.style.pointerEvents = 'none';
                
                // Record that user has cleared it this session
                sessionStorage.setItem('empathy_veil_cleared', 'true');
                
                gsap.to([overlay, hint], {
                    opacity: 0,
                    duration: 1.5,
                    ease: 'power2.inOut',
                    onComplete: () => {
                        overlay.remove();
                        hint.remove();
                    }
                });
                
                gsap.fromTo(archiveItems, 
                    { y: 50, opacity: 0 },
                    { y: 0, opacity: 1, duration: 1.2, stagger: 0.1, ease: 'power3.out', delay: 0.2 }
                );
            }
            
            overlay.addEventListener('mousedown', (e) => { isDrawing = true; lastPos = null; erase(e.clientX, e.clientY); });
            overlay.addEventListener('mousemove', (e) => { if (isDrawing) erase(e.clientX, e.clientY); });
            window.addEventListener('mouseup', () => { isDrawing = false; lastPos = null; });
            
            overlay.addEventListener('touchstart', (e) => { isDrawing = true; lastPos = null; const p = getPos(e); erase(p.x, p.y); });
            overlay.addEventListener('touchmove', (e) => { if (isDrawing) { e.preventDefault(); const p = getPos(e); erase(p.x, p.y); } }, {passive: false});
            window.addEventListener('touchend', () => { isDrawing = false; lastPos = null; });
        });
    </script>
</body>
